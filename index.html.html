<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Portal - Login</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #16a34a;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #15803d;
    }
    .logout-btn {
      background: #dc2626;
      margin-top: 10px;
    }
    .logout-btn:hover {
      background: #b91c1c;
    }
    #status {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Stock Portal Login</h2>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="owner@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" />

      <button type="submit">Login</button>
    </form>

    <div id="user-panel" class="hidden">
      <p id="user-info"></p>
      <button type="button" class="logout-btn" id="logout-btn">Logout</button>
    </div>

    <div id="status"></div>
  </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://aubwiksmxqqwjbhabgop.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_t2uVkTTlpH7yDpjZzmpM1w__hRudXgl';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('login-form');
    const statusEl = document.getElementById('status');

    (async function initLogin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
        return;
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusEl.textContent = 'Login ဝင်နေပါသည်...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          statusEl.textContent = `Login မအောင်မြင်ပါ: ${error.message}`;
          return;
        }

        statusEl.textContent = 'Login အောင်မြင်ပါပြီ။ Dashboard သို့ သွားနေပါသည်...';
        window.location.href = 'dashboard.html';
      });
    })();
  </script>
</body>
</html>
